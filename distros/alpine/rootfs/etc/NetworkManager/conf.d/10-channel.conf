# Channel keeps the USB RNDIS management link under the device-specific
# configfs helper. NetworkManager owns Wi-Fi, but must never reconfigure usb0.
[main]
dhcp=internal
plugins=ifupdown,keyfile

[ifupdown]
managed=true

[keyfile]
unmanaged-devices=interface-name:usb0

[device]
wifi.backend=wpa_supplicant
