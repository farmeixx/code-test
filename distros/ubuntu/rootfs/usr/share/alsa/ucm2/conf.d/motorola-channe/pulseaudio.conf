# Motorola Moto G7 Play (channel) - validated wired-headphone route.
# The verb must initialize the playback path for PulseAudio UCM discovery
# immediately after boot; per-device initialization alone produced auto_null.
SectionVerb {
    EnableSequence [
        cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
        cset "name='RX1 MIX1 INP1' RX1"
        cset "name='RX2 MIX1 INP1' RX2"
        cset "name='RDAC2 MUX' RX2"
        cset "name='HPHL' Switch"
        cset "name='HPHR' Switch"
    ]
    Value {
        TQ "HiFi"
        Priority 8000
    }
}

SectionDevice."Headphones" {
    Comment "Wired stereo headphones"
    EnableSequence [
        cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
        cset "name='RX1 MIX1 INP1' RX1"
        cset "name='RX2 MIX1 INP1' RX2"
        cset "name='RDAC2 MUX' RX2"
        cset "name='HPHL' Switch"
        cset "name='HPHR' Switch"
    ]
    DisableSequence [
        cset "name='HPHL' ZERO"
        cset "name='HPHR' ZERO"
        cset "name='RX1 MIX1 INP1' ZERO"
        cset "name='RX2 MIX1 INP1' ZERO"
        cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' off"
    ]
    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
}
