# Motorola Moto G7 Play (channel) firmware layout.
# Source this trusted file from sh/firmware.sh.

#------------------------------------------------------------------#

# The firmware repository is cloned at build time; its SHA256SUMS is verified.
# FIRMWARE_SOURCE_DIR (environment) points the installer at an already
# available local tree instead, e.g. for offline builds.

FIRMWARE_URL="https://gitlab.com/vanadium-oss/motorola-msm8953/mainline/channel-firmware.git"
FIRMWARE_REF=""  # Empty: repository default branch.
FIRMWARE_DEST="/lib/firmware"

#------------------------------------------------------------------#

# Copy whole source directories recursively; no individual firmware file list.
# Format: repository-directory | destination relative to FIRMWARE_DEST

FIRMWARE_DIRS=(
  "modem|."
  "qcom|qcom"
  "touchscreen|touchscreen"
  "wlan|wlan"
)

#------------------------------------------------------------------#

# Additional paths requested by the WCN36xx driver / Channel DT.

FIRMWARE_ALIASES=(
  "wlan/WCNSS_qcom_wlan_nv.bin|wlan/prima/WCNSS_qcom_wlan_nv.bin"
  "wlan/WCNSS_qcom_wlan_nv.bin|qcom/msm8953/motorola/channel/WCNSS_qcom_wlan_nv.bin"
)

#------------------------------------------------------------------#

# Basic completeness checks. Every other file is copied automatically.

FIRMWARE_REQUIRED=(
  "modem/wcnss.mdt"
  "modem/wcnss.b06"
  "modem/adsp.mdt"
  "modem/venus.mdt"
  "wlan/WCNSS_qcom_wlan_nv.bin"
)

#------------------------------------------------------------------#
