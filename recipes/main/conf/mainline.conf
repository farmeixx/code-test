# Mainline kernel configuration for Motorola Moto G7 Play (channel / SDM632).
# To port to another device, edit this file, not the shared .sh scripts.

#------------------------------------------------------------------#

# Kernel source checkout. run.sh clones this branch shallowly, aborts if
# KERNEL_REF advances between ls-remote and clone, and records the resolved
# commit sha in source-report.txt so each reusable checkpoint maps to exactly
# one source commit. Pin a fixed sha instead of a branch to freeze a baseline.
# KERNEL_CLONE_DIR is scratch space; run.sh only permits paths under .work/
# so rebuild rm -rf can never escape the workspace.

KERNEL_URL="https://gitlab.com/vanadium-oss/motorola-msm8953/mainline/linux.git"
KERNEL_REF="msm8953/latest"
KERNEL_CLONE_DIR=".work/kernel/source"

#------------------------------------------------------------------#

# Cross build contract. make receives ARCH=$KERNEL_ARCH and
# CROSS_COMPILE=$KERNEL_CROSS_COMPILE; run.sh places a ccache shim in front
# of the cross compiler so every object is cached between runs.
# KERNEL_BASE_CONFIG is a make target (not a file path) that seeds .config
# before the fragment slots below.

KERNEL_ARCH="arm64"
KERNEL_CROSS_COMPILE="aarch64-linux-gnu-"
KERNEL_BASE_CONFIG="defconfig"

#------------------------------------------------------------------#

# Reuse the MSM8953 upstream fragment, which carries the original
# CONFIG_LOCALVERSION=-Sanders-Revived. This label is not a device check.
# The kernel and modules MUST receive exactly the same built KERNELRELEASE.
# Paths are relative to the cloned kernel source, or use repo:PATH for local files.
# Slot semantics: empty string ignores the slot, a relative path resolves
# inside the cloned kernel source, and repo:PATH points into this builder
# repository. merge_config.sh runs first; KERNEL_ENABLE_* (scripts/config)
# and olddefconfig follow, so an explicit enable always wins propagation.
# Slot 2 pins the shipped release label via repo:conf/release-label.config:
# CONFIG_LOCALVERSION=-mainline with CONFIG_LOCALVERSION_AUTO not set, so a
# source refresh can never silently change the built release, and every
# checkpoint consumer keeps matching one reproducible KERNELRELEASE.

KERNEL_CONFIG_1="arch/arm64/configs/msm8953.config"
KERNEL_CONFIG_2="repo:conf/release-label.config"

#------------------------------------------------------------------#

# Shipped release pin, consumed by sh/build.sh (all three flows). Why two
# variables: KERNEL_PIN_RELEASE is the byte-exact final release (the same
# string the local builders pin in conf/release.conf), and
# KERNEL_PIN_LOCALVERSION is the slot-2 label alone, re-asserted through
# scripts/config after the fragment merge. Why the re-assertion: an
# Actions run merged both fragments correctly into .config while
# `make kernelrelease` still resolved against stale generated state
# (shallow clone with no tags, CONFIG_LOCALVERSION_AUTO=y resurrected),
# shipping the git -g suffix in a checkpoint the consumers trust. scripts/
# config writes the final two lines into .config directly and build.sh
# aborts (10 s, not hours) when the compiled release misses the pin.

KERNEL_PIN_RELEASE="7.3.0-rc7-mainline"

KERNEL_PIN_LOCALVERSION="-mainline"

#------------------------------------------------------------------#

# Additional options explicitly requested for this device (empty arrays: no edits).
# Why these two: QCOM_CPR4PD owns the CPU power rail request on msm8953 and
# QCOM_CLK_APCS_MSM8953 owns the A53 cluster APCS clock mux; the pair drives
# CPU frequency scaling on channel. Arrays feed scripts/config after the
# fragment merge; an empty array is a no-op.

KERNEL_ENABLE_Y=(QCOM_CPR4PD QCOM_CLK_APCS_MSM8953)
KERNEL_ENABLE_M=()

#------------------------------------------------------------------#

# Build validation belongs to the device config, not the generic scripts.
# Fail-closed assertions, not edits: build.sh checks the finalized .config
# with the exact symbol state (y or m) and aborts otherwise. Purpose groups:
# boot: BLK_DEV_INITRD RD_GZIP DEVTMPFS(+DEVTMPFS_MOUNT) EXT4_FS
# storage: MMC block and msm sdhci stack for the phone eMMC
# usb: DWC3 gadget with ConfigFS RNDIS so the device appears as usb0
# net/remoteproc: NET INET WLAN ath for wcn36xx plus RPMSG/SMEM/SMP2P/SMSM
# modem channels. The M list is the modular Wi-Fi stack and WCNSS firmware
# loading (WCN36XX, QCOM_WCNSS_PIL/CTRL).

KERNEL_REQUIRE_Y=(
  QCOM_CPR4PD QCOM_CLK_APCS_MSM8953
  BLK_DEV_INITRD RD_GZIP DEVTMPFS DEVTMPFS_MOUNT EXT4_FS
  MMC MMC_BLOCK MMC_SDHCI MMC_SDHCI_PLTFM MMC_SDHCI_MSM
  CONFIGFS_FS USB USB_DWC3 USB_DWC3_QCOM USB_GADGET USB_CONFIGFS_RNDIS
  NET INET WLAN WLAN_VENDOR_ATH RPMSG_QCOM_SMD QCOM_SMEM QCOM_SMP2P QCOM_SMSM
)
KERNEL_REQUIRE_M=(
  USB_CONFIGFS CFG80211 MAC80211 WCN36XX QCOM_WCNSS_PIL QCOM_WCNSS_CTRL
)

#------------------------------------------------------------------#

# Built DTB path inside kernel source; no DTB name/path is hardcoded in the .sh.
# Built output paths are configured here, never hardcoded in the .sh.
# Image.gz plus the DTB concatenate into Image.gz-dtb, and the finished
# boot.img must compare byte-for-byte against that payload. KERNEL_DTB_CHECK_*
# asserts the iris qcom,wcn3620 Wi-Fi node in the built DTB at build time and
# again during checkpoint validation.

KERNEL_DTB="arch/arm64/boot/dts/qcom/sdm632-motorola-channel.dtb"
KERNEL_IMAGE_TARGET="Image.gz"
KERNEL_IMAGE_PATH="arch/arm64/boot/Image.gz"

#------------------------------------------------------------------#

# Optional DTB postprocess hook for a builder script (repo:PATH or /absolute).
# Empty: no device-tree modifications.

KERNEL_DTB_POSTPROCESS=""

#------------------------------------------------------------------#

# Optional device-tree assertion. Empty KERNEL_DTB_CHECK_NODE skips it.

KERNEL_DTB_CHECK_NODE="/soc@0/remoteproc@a204000/iris"
KERNEL_DTB_CHECK_PROPERTY="compatible"
KERNEL_DTB_CHECK_VALUE="qcom,wcn3620"

#------------------------------------------------------------------#

# Android boot image settings are device-specific too.
# Android boot contract: rootfs boots from PARTLABEL=userdata, debug flows
# over UART ttyMSM0 and USB RNDIS. run.sh unpacks the packed image again and
# verifies its kernel payload equals Image.gz-dtb byte-for-byte and that the
# cmdline contains root=$KERNEL_ROOT_DEVICE. Base, offsets, page size and
# header version match the msm8953 bootloader; 48 MiB caps the boot volume.

KERNEL_BOOT_NAME="boot-channel.img"
KERNEL_ROOT_DEVICE="PARTLABEL=userdata"
KERNEL_CMDLINE="console=ttyMSM0,115200n8 console=tty0 root=PARTLABEL=userdata rootfstype=ext4 rootwait rw loglevel=7 ignore_loglevel"
KERNEL_BOOT_HEADER_VERSION=0
KERNEL_BOOT_BASE="0x80000000"
KERNEL_BOOT_KERNEL_OFFSET="0x00008000"
KERNEL_BOOT_RAMDISK_OFFSET="0x01000000"
KERNEL_BOOT_SECOND_OFFSET="0x00f00000"
KERNEL_BOOT_TAGS_OFFSET="0x00000100"
KERNEL_BOOT_PAGE_SIZE=2048
KERNEL_BOOT_SIZE_LIMIT_MIB=48

#------------------------------------------------------------------#

# mkbootimg is fetched from AOSP at one exact commit and run.sh re-verifies
# checked-out HEAD equals KERNEL_MKBOOTIMG_REF before packing, so tool changes
# cannot silently alter the boot image layout.

KERNEL_MKBOOTIMG_URL="https://android.googlesource.com/platform/system/tools/mkbootimg"
KERNEL_MKBOOTIMG_REF="d3b6ee4295e1491432ce3d0fcfd53631177bbef4"

#------------------------------------------------------------------#
