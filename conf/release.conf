# Kernel release pin for the local builders (channel / SDM632). The repo side
# produces exactly this release via repo:conf/release-label.config; the local
# guards make sure no stage ever sees a different string.

#------------------------------------------------------------------#

# Pinned release identity. KERNEL_RELEASE must end with KERNEL_SUFFIX and
# KERNEL_SUFFIX must start with a dash. When the msm8953/latest base moves,
# bump KERNEL_RELEASE here; the next build refuses the stale checkpoint with
# a clear message instead of reusing a mismatched modules archive.

KERNEL_RELEASE="7.3.0-rc7-mainline"
KERNEL_SUFFIX="-mainline"

#------------------------------------------------------------------#

# Bump ritual after a source refresh: read the new base from the kernel tree
# Makefile (VERSION/PATCHLEVEL/SUBLEVEL/EXTRAVERSION), apply the change here
# if it moved, and rebuild. Everything else (archive names, lib/modules path,
# metadata) derives from these strings.

#------------------------------------------------------------------#
