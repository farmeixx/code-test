# Rootfs images. The python raw-rootfs generator turns these into its fixed
# ext4 policy (raw output, no zstd). Per-distro free minimums keep each
# distro's own default unless overridden here.
IMAGE_SIZE_MB="1024"
IMAGE_FREE_MIN_ALPINE="32"
IMAGE_FREE_MIN_DEBIAN_UBUNTU="64"
DISTROS="alpine debian ubuntu"

DEBIAN_SUITE="stable"
UBUNTU_VERSION=""
