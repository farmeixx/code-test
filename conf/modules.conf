# Module extraction contract for the local builders (channel / SDM632).

#------------------------------------------------------------------#

# Name of the modules archive stored inside the kernel checkpoint. It is a
# file name, not a full path: paths belong to the cache layout, so a layout
# change never has to touch this contract. The name is derived from the
# pinned release, keeping every artifact keyed by the same identity.

MODULES_ARCHIVE="kernel-modules-${KERNEL_RELEASE}.tar.zst"

#------------------------------------------------------------------#

# Where the archive must extract inside a rootfs tree, which modules MUST be
# present after extraction, and the checksum manifest kept beside it in the
# checkpoint. MODULES_REQUIRED is enforced by check_required_modules during
# every rootfs build (tar listing only, nothing is extracted or written);
# the other strings stay in one place so the whole contract ships with the
# pin instead of being scattered over the scripts.

MODULES_TARGET="lib/modules/${KERNEL_RELEASE}"
MODULES_REQUIRED=(libcomposite wcn36xx)
MODULES_SHA_MANIFEST="SHA256SUMS"

#------------------------------------------------------------------#

# Upstream validators that enforce the same facts (release format, archive
# layout and the vermagic embedded in every module); kept here so the pin
# and the contract travel together whenever the release naming changes.

MODULES_VALIDATORS="check-kernel-release.sh check-modules.sh"

#------------------------------------------------------------------#
